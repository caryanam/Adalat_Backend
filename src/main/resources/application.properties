spring.application.name=adalat-backend

spring.server.url=

############# LOCAL CONFIGURATION #########
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/adalat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root}
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:Adalat_backend/.env[.properties],optional:file:./Adalat_backend/.env[.properties]

# =========================================
# MySQL Configuration
# =========================================

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# =========================================
# JWT Security Configuration
# =========================================

security.jwt.secret=kefkefnenfenfssssenfnefefnefvbnenfewfnefnefnefnenfenfenfewjnfewnfewnfewfln
security.jwt.expiration=3600


# =========================================
# Multipart File Upload Configuration (Documents - PDF, Images, Audio, Video up to 10MB)
# =========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# =========================================
# Document Upload Storage Configuration
# =========================================
app.upload.document-dir=uploads/customer-documents
app.file.base-url=http://localhost:8082
app.file.lawyer-upload-dir=uploads/lawyers

# =========================================
# Email Service Configuration (Hostinger SMTP)
# =========================================
spring.mail.host=smtp.hostinger.com
spring.mail.port=465
spring.mail.username=support@whatsupmarketplace.com
spring.mail.password=${SPRING_MAIL_PASSWORD:Kharadi@6006}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# =========================================
# OpenAPI / Swagger UI Configuration
# =========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# =========================================
# Socket.IO Real-Time Chat Server Configuration
# =========================================
socketio.host=0.0.0.0
socketio.port=9092



# =========================================
# AI Provider Configuration
# =========================================
ai.provider=external
ai.api-key=${GEMINI_API_KEY}
ai.base-url=https://generativelanguage.googleapis.com
ai.model=gemini-1.5-flash
ai.timeout-seconds=15


